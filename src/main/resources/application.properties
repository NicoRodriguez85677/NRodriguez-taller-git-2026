spring.application.name=NRodriguez-taller-git-2026

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./data/minecraft
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Persistencia JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Puerto HTTP
server.port=8080

# POO-09 - APIs cruzadas
# A1: Nicolas Rodriguez (este servicio)
# A2 y A3: APIs de los companeros

poo09.a2.base-url=${POO09_A2_URL:}
poo09.a3.base-url=${POO09_A3_URL:}

# POO-09 - Tiempos de espera para APIs externas
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=10s
